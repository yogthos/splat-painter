name: release

# Build standalone binaries for macOS (arm64) and Linux (x86_64) and attach them
# to the GitHub Release when a v* tag is pushed. workflow_dispatch builds the same
# binaries as workflow artifacts without publishing a release (handy for testing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload assets

# The compiler version is resolved at build time (see "Resolve jolt version"), not
# pinned here: a release should ship a binary built by the current compiler, not by
# whatever was current the last time someone edited this file.
#
# What makes that safe is ORDER: Test, Check and the --opt build all run BEFORE the
# publish step, so a jolt release that cannot build this tree fails the job and uploads
# nothing. The tag survives and the run can be retried. What it is NOT safe against is
# a compiler that builds cleanly and paints differently — the gates would have to catch
# that, and -M:check plus the seed goldens are what stand there.
#
# To pin during an incident, set the JOLT_PIN repository variable (Settings → Variables)
# to a tag like v0.6.1. No workflow edit, no commit.
#
# History worth keeping, because every one of these was a real release-day failure:
#  - Upstream renamed both the binary and the release asset at 0.5.0, so a pin below
#    that boundary also needs the asset name and every invocation changed with it.
#  - 0.5.2 through 0.5.5 cannot compile 3+ argument long arithmetic (jolt-l+/l-/l* went
#    binary-only), which this codebase uses in ~17 sites including seed/hash01. Fixed
#    in 0.5.6.
#  - Below 0.5.13, par/threads saw (.availableProcessors) report 1, so the field
#    builders silently ran serially.
#  - 0.5.13's dependency resolver shells out to `git checkout <sha> -`, and current git
#    rejects that bare `-` as a pathspec, so it cannot fetch the pinned glimmer-gl /
#    glimmer deps at all — warm cache or cold, on an unchanged deps.edn. v0.1.8 built
#    with it on 2026-07-31, so it is a git-version-dependent latent failure in that
#    compiler rather than anything in the tree.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-macos
          - os: ubuntu-latest
            target: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The binary dlopens GTK4/OpenGL/gdk-pixbuf at runtime rather than linking
      # them, so these are needed to run the headless test suite (image decode)
      # and by anyone running the released binary — not to compile it.
      - name: System deps (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk4 gdk-pixbuf lz4

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libgdk-pixbuf-2.0-0 libgdk-pixbuf2.0-bin libjpeg-turbo8 libgl1 liblz4-dev
          # The runner's prebaked gdk-pixbuf loaders.cache lists no JPEG loader, so
          # image decode crashes. Rebuild the cache from the installed modules and
          # point the app at it. query-loaders lives in the multiarch lib dir, not
          # on PATH.
          ql=$(find /usr/lib /usr/libexec -name gdk-pixbuf-query-loaders 2>/dev/null | head -1)
          sudo "$ql" --update-cache
          cache=$(find /usr/lib -path '*gdk-pixbuf*' -name loaders.cache 2>/dev/null | head -1)
          echo "GDK_PIXBUF_MODULE_FILE=$cache" >> "$GITHUB_ENV"

      # Latest release by default; JOLT_PIN (repo variable) overrides without a commit.
      # Resolved once per job and echoed, so the build log always records which compiler
      # produced the binary that got published — the pin used to be readable from the
      # workflow file, and with "latest" the log is the only place that survives.
      - name: Resolve jolt version
        env:
          GH_TOKEN: ${{ github.token }}
          JOLT_PIN: ${{ vars.JOLT_PIN }}
        run: |
          if [ -n "$JOLT_PIN" ]; then
            ver="$JOLT_PIN"
            echo "jolt: PINNED to $ver via the JOLT_PIN repository variable"
          else
            ver=$(gh api repos/jolt-lang/jolt/releases/latest --jq .tag_name)
            [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "could not resolve latest jolt"; exit 1; }
            echo "jolt: latest release is $ver"
          fi
          echo "JOLT_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install jolt
        run: |
          url="https://github.com/jolt-lang/jolt/releases/download/${JOLT_VERSION}/jolt-${JOLT_VERSION}-${{ matrix.target }}.tar.gz"
          curl -fsSL -o jolt.tar.gz "$url"
          mkdir -p "$HOME/.jolt-dist"
          tar xzf jolt.tar.gz -C "$HOME/.jolt-dist" --strip-components=1
          echo "$HOME/.jolt-dist" >> "$GITHUB_PATH"

      - name: jolt version
        run: jolt --version

      - name: Test (headless)
        run: jolt -M:test

      # asserts the geometry shader still mirrors the CPU seed, line for line.
      # It is not part of -M:test, so it went stale unnoticed for a day when a
      # shader constant moved without its pin — exactly the drift it exists to
      # catch. Running it here is what keeps it honest.
      - name: Check (CPU/GPU mirror pins)
        run: jolt -M:check

      - name: Build binary
        run: jolt build -m splat-painter.core -o splat-painter --opt

      - name: Package
        # Name from the REF, not the event. A workflow_dispatch ON A TAG is still that
        # tag's release — the Publish step below keys on exactly that — but naming off
        # the event stamped the version out of the asset, so a release cut that way
        # shipped splat-painter-aarch64-macos.tar.gz where every other release carries
        # splat-painter-v0.1.10-aarch64-macos.tar.gz. Only an untagged build (dispatch
        # on a branch) gets the bare name.
        run: |
          case "${GITHUB_REF}" in
            refs/tags/*) name="splat-painter-${GITHUB_REF_NAME}-${{ matrix.target }}" ;;
            *)           name="splat-painter-${{ matrix.target }}" ;;
          esac
          mkdir -p "$name"
          cp splat-painter README.md "$name/"
          tar czf "${name}.tar.gz" "$name"
          echo "PKG=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "splat-painter ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes "Standalone binaries for macOS (arm64) and Linux (x86_64).

          Runtime deps: GTK4 + gdk-pixbuf (\`brew install gtk4\` / \`apt install libgtk-4-1 libgdk-pixbuf-2.0-0\`).
          macOS binary is unsigned — clear the quarantine flag before first run:
          \`xattr -d com.apple.quarantine ./splat-painter\`." \
            || echo "release already exists, uploading asset"
          gh release upload "${GITHUB_REF_NAME}" "${PKG}" --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: splat-painter-${{ matrix.target }}
          path: splat-painter
